version: v1.0
name: "\U0001F3AF Simple CI Pipeline"
agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2404
fail_fast:
  stop:
    when: branch != 'main'
auto_cancel:
  running:
    when: branch != 'main'
  queued:
    when: branch = 'main'
blocks:
  - name: "\U0001F9EA Test 2"
    dependencies: []
    task:
      jobs:
        - name: "\U0001F7E2 Run Tests"
          commands:
            - checkout
            - echo "Checking out code..."
            - echo "Installing dependencies..."
            - echo "Running test suite..."
            - echo "Tests completed successfully! =====--==="
        - name: mysql sem-version
          commands:
            - sem-service start mysql 8
            - mysql --version
        - name: mysql memory
          commands:
            - 'docker run --net=host --rm -d --name mysql --tmpfs /var/lib/mysql:rw,size=2g,mode=1777 -v /var/run/mysqld:/var/run/mysqld -e MYSQL_ALLOW_EMPTY_PASSWORD=yes -e MYSQL_DATABASE=test registry.semaphoreci.com/mysql:8 --innodb-flush-log-at-trx-commit=0 --innodb-doublewrite=0 --skip-log-bin --performance-schema=OFF'
            - sem-dockerize 3306 mysql
